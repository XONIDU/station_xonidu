<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zone F — Exterior Assembly</title>
  <link rel="stylesheet" href="style.css?v=14">
  <script>
    // El juego empieza obligatoriamente en el menu. Si no hay sesion iniciada
    // o no hay una mision activa en el backend, se redirige al menu.
    async function ensureMenu() {
      if (!sessionStorage.getItem("xonidu-started")) {
        location.replace("../menu/index.html"); return;
      }
      try {
        const r = await fetch("/api/mission");
        if (r.ok) {
          const d = await r.json();
          if (!d || !d.mission || !d.mission.active) {
            location.replace("../menu/index.html"); return;
          }
        }
      } catch (e) {
        // Sin backend: confiamos en la sesion
      }
    }
    ensureMenu();
  </script>
</head>
<body>
  <header class="bar">
    <h1 data-i18n="zoneF">Zone F — Exterior Assembly</h1>
    <div class="legend">
      <span><i class="dot ok"></i><span data-i18n="legendNormal">Normal</span></span>
      <span><i class="dot warn"></i><span data-i18n="legendAnomaly">Anomalía</span></span>
      <span><i class="dot crit"></i><span data-i18n="legendCritical">Crítico</span></span>
    </div>
  </header>

  <main class="layout">
    <div id="stage" class="stage">
      <img id="bg" src="zone-f.png" alt="Zone F — Exterior Assembly">
      <svg id="shapes" class="shapes" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <button id="mapHot" class="maphot" type="button" aria-label="MAP: back to the station map"></button>
      <div id="toast" class="toast" role="status"></div>
    </div>

    <aside class="panel">
      <p id="hint" class="muted" data-i18n="zoneHint">Toca un módulo para seleccionarlo.</p>
      <div id="info" hidden>
        <h2 id="mTitle"></h2>
      </div>
      <button id="mapBtn" class="primary" type="button" data-i18n="mapButtonLabel">MAP · Volver al mapa</button>

    </aside>
  </main>

  <section id="moduleScreen" class="module-screen" hidden aria-hidden="true" role="dialog" aria-modal="true" data-i18n-aria="moduleScreenLabel">
    <button id="moduleExit" type="button" class="module-exit" data-i18n-aria="moduleExitAria">✕</button>
    <div class="module-card">
      <h2 id="moduleTitle" data-i18n="moduleScreenTitle">Module</h2>
      <div id="moduleId" class="module-id">mod-f-energy_propulsion</div>
      <div id="moduleStatus" class="module-status ok">OK</div>
      <iframe id="moduleFrame" data-i18n-title="moduleFrameTitle" title="Pantalla del módulo" src="about:blank"></iframe>
      <div id="simPlaceholder" class="sim-placeholder" hidden>SIMULATION PENDING</div>
    </div>
  </section>

  <script src="../i18n.js?v=1"></script>
  <script src="../store.js?v=14"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
